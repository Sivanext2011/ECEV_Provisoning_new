[project]
name = "ecev-provisioning"
version = "2.0.0"
description = "Provisioning tool for Ericsson BSSF/CPM/RMCA"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
